<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Cabinet Zormati</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {primary: {500:'#0ea5e9',600:'#0284c7',700:'#0369a1'}},
          fontFamily: {sans:['Inter','system-ui','sans-serif']}
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-full bg-primary-600 flex items-center justify-center mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      </div>
      <h1 class="text-xl font-bold text-white">Espace Admin</h1>
      <p class="text-slate-400 text-sm mt-1">Cabinet Zormati Athar</p>
    </div>
    <form id="admin-login" class="bg-slate-800 rounded-2xl p-6 space-y-4 border border-slate-700">
      <div>
        <label class="block text-sm text-slate-300 mb-1">Mot de passe</label>
        <input type="password" id="admin-pass" required class="w-full px-4 py-3 rounded-xl bg-slate-700 border border-slate-600 text-white focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold transition">Connexion</button>
    </form>
    <p class="text-center mt-4 text-xs text-slate-500">Mot de passe : <code class="text-primary-400">zormati2025</code></p>
  </div>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById('admin-login').addEventListener('submit', async function(e) {
      e.preventDefault();
      try {
        await API.adminLogin(document.getElementById('admin-pass').value);
        localStorage.setItem('admin_logged', '1');
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message || 'Mot de passe incorrect');
      }
    });
  </script>
</body>
</html>
