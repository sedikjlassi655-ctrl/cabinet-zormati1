<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Cabinet Zormati</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {50:'#f0f9ff',100:'#e0f2fe',500:'#0ea5e9',600:'#0284c7',700:'#0369a1'},
            softpink: {400:'#f472b6',500:'#ec4899'}
          },
          fontFamily: {sans:['Inter','system-ui','sans-serif']}
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen font-sans antialiased">
  <nav class="bg-slate-900 text-white sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="font-semibold">Admin — Cabinet Zormati</div>
      <button id="logout" class="text-sm text-slate-400 hover:text-white">Déconnexion</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex gap-2 mb-6 overflow-x-auto">
      <button data-tab="requests" class="tab-btn active px-4 py-2 rounded-full text-sm font-medium bg-primary-600 text-white">Demandes RDV</button>
      <button data-tab="patients" class="tab-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-slate-600 hover:bg-slate-50">Patients</button>
    </div>

    <div id="tab-requests" class="tab-content">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">Demandes de rendez-vous <span id="req-count" class="text-sm font-normal text-slate-400"></span></h2>
      <div id="requests-list" class="space-y-4"></div>
    </div>

    <div id="tab-patients" class="tab-content hidden">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">Tous les patients</h2>
      <div id="patients-list" class="space-y-4"></div>
    </div>
  </main>

  <div id="session-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="font-semibold text-lg mb-4">Marquer une séance réalisée</h3>
      <p class="text-sm text-slate-500 mb-4" id="modal-patient-name"></p>
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Note (optionnel)</label>
        <input type="text" id="session-note" class="w-full px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-300" placeholder="Ex: Bonne progression..." />
      </div>
      <div class="flex gap-3">
        <button id="modal-cancel" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium">Annuler</button>
        <button id="modal-confirm" class="flex-1 py-2.5 rounded-xl bg-primary-600 text-white font-medium hover:bg-primary-700">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    if (localStorage.getItem('admin_logged') !== '1') window.location.href = 'login.html';

    let currentPatientId = null;

    async function loadRequests() {
      try {
        const requests = await API.getRdvs();
        document.getElementById('req-count').textContent = `(${requests.length})`;
        const list = document.getElementById('requests-list');
        if (requests.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-12">Aucune demande pour le moment.</p>';
          return;
        }
        list.innerHTML = requests.map(r => `
          <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-3">
              <div>
                <div class="font-semibold text-slate-900">${r.prenom} ${r.nom}</div>
                <div class="text-sm text-slate-500">${r.email} • ${r.telephone}</div>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full ${r.status==='pending'?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700'}">${r.status==='pending'?'En attente':'Contacté'}</span>
            </div>
            <div class="grid sm:grid-cols-2 gap-2 text-sm text-slate-600 mb-3">
              <div><span class="text-slate-400">Soin :</span> ${r.service}</div>
              <div><span class="text-slate-400">Pack :</span> ${r.pack ? r.pack + ' seances' : 'Sans pack'}</div>
              <div><span class="text-slate-400">Lieu :</span> ${r.lieu}</div>
              <div><span class="text-slate-400">Date :</span> ${new Date(r.createdAt).toLocaleString('fr-FR')}</div>
            </div>
            ${r.message ? `<p class="text-sm text-slate-500 bg-slate-50 rounded-lg p-3 mb-3">"${r.message}"</p>` : ''}
            <div class="flex flex-wrap gap-2">
              <a href="tel:${r.telephone}" class="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg bg-primary-50 text-primary-700 font-medium hover:bg-primary-100">📞 Appeler</a>
              <a href="mailto:${r.email}" class="inline-flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-lg bg-slate-50 text-slate-600 font-medium hover:bg-slate-100">✉️ Email</a>
              ${r.status==='pending' ? `<button onclick="markContacted('${r.id}')" class="text-sm px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 font-medium hover:bg-emerald-100">✓ Marquer contacté</button>` : ''}
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('requests-list').innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement. Assurez-vous que le serveur est démarré.</p>';
      }
    }

    async function loadPatients() {
      try {
        const patients = await API.getPatients();
        const list = document.getElementById('patients-list');
        if (patients.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-sm text-center py-12">Aucun patient enregistré.</p>';
          return;
        }
        list.innerHTML = patients.map(p => `
          <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
              <div>
                <div class="font-semibold text-slate-900">${p.prenom} ${p.nom}</div>
                <div class="text-sm text-slate-500">${p.email} • ${p.telephone}</div>
              </div>
              <div class="text-right text-sm">
                <div class="font-medium text-primary-600">${p.remainingSessions || 0} restantes</div>
                <div class="text-xs text-slate-400">${p.completedSessions || 0}/${p.totalSessions || 0} réalisées</div>
              </div>
            </div>
            <div class="flex items-center gap-2 mb-4">
              <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-primary-500 to-primary-600 rounded-full" style="width:${p.totalSessions ? Math.round((p.completedSessions/p.totalSessions)*100) : 0}%"></div>
              </div>
              <span class="text-xs text-slate-400">${p.totalSessions ? Math.round((p.completedSessions/p.totalSessions)*100) : 0}%</span>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openSessionModal('${p.id}','${p.prenom} ${p.nom}',${p.remainingSessions||0})" class="text-sm px-3 py-1.5 rounded-lg bg-primary-600 text-white font-medium hover:bg-primary-700">+ Séance réalisée</button>
              <button onclick="addSessions('${p.id}', 5)" class="text-sm px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">+5 séances</button>
              <button onclick="addSessions('${p.id}', 10)" class="text-sm px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 font-medium hover:bg-slate-200">+10 séances</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('patients-list').innerHTML = '<p class="text-red-500 text-sm">Erreur de chargement.</p>';
      }
    }

    window.markContacted = async function(id) {
      await API.updateRdv(id, { status: 'contacted' });
      loadRequests();
    };

    window.openSessionModal = function(id, name, remaining) {
      currentPatientId = id;
      document.getElementById('modal-patient-name').textContent = name + ' — ' + remaining + ' séances restantes';
      document.getElementById('session-note').value = '';
      document.getElementById('session-modal').classList.remove('hidden');
      document.getElementById('session-modal').classList.add('flex');
    };

    window.addSessions = async function(id, n) {
      await API.addSessions(id, n);
      loadPatients();
    };

    document.getElementById('modal-cancel').onclick = () => {
      document.getElementById('session-modal').classList.add('hidden');
      document.getElementById('session-modal').classList.remove('flex');
    };

    document.getElementById('modal-confirm').onclick = async () => {
      if (!currentPatientId) return;
      try {
        await API.completeSession(currentPatientId, document.getElementById('session-note').value);
        loadPatients();
      } catch (e) {
        alert(e.message);
      }
      document.getElementById('session-modal').classList.add('hidden');
      document.getElementById('session-modal').classList.remove('flex');
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active','bg-primary-600','text-white');
          b.classList.add('bg-white','text-slate-600');
        });
        btn.classList.add('active','bg-primary-600','text-white');
        btn.classList.remove('bg-white','text-slate-600');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    document.getElementById('logout').onclick = () => {
      localStorage.removeItem('admin_logged');
      window.location.href = 'login.html';
    };

    loadRequests();
    loadPatients();
  </script>
</body>
</html>
