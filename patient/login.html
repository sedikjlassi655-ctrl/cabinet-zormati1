<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace Patient | Cabinet Zormati</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {primary: {50:'#f0f9ff',100:'#e0f2fe',500:'#0ea5e9',600:'#0284c7',700:'#0369a1'}},
          fontFamily: {sans:['Inter','system-ui','sans-serif'], display:['Playfair Display','serif']}
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-2 mb-6">
        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v16m8-8H4"/></svg>
        </div>
      </a>
      <h1 class="font-display text-2xl font-bold text-slate-900">Espace Patient</h1>
      <p class="text-slate-500 text-sm mt-1">Connectez-vous avec votre email ou téléphone</p>
    </div>
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 md:p-8">
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Email ou Téléphone</label>
          <input type="text" id="login-id" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary-300 transition" placeholder="email@exemple.com ou 52 XXX XXX" />
        </div>
        <button type="submit" id="btn" class="w-full py-3.5 rounded-full bg-gradient-to-r from-primary-600 to-primary-700 text-white font-semibold shadow-lg hover:shadow-xl transition-all">
          Accéder à mon espace
        </button>
      </form>
      <p class="text-xs text-center text-slate-400 mt-5">Première visite ? Faites d'abord une <a href="../rdv.html" class="text-primary-600 font-medium">demande de rendez-vous</a>.</p>
    </div>
    <p class="text-center mt-6"><a href="../index.html" class="text-sm text-slate-500 hover:text-primary-600">← Retour au site</a></p>
  </div>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'Connexion...';
      try {
        const patient = await API.loginPatient(document.getElementById('login-id').value);
        localStorage.setItem('current_patient_id', patient.id);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
        btn.textContent = 'Accéder à mon espace';
      }
    });
  </script>
</body>
</html>
